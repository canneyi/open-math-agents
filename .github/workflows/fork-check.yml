# Fork-only compile loop. Repeats the steps of check-proof.yml for one file on one ref of this fork, so a proof is
# checked here before a pull request is opened upstream. Not for upstream: it is started by hand only.
name: fork-check
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit of this fork, cut from upstream main, that adds the file
        required: true
      file:
        description: proofs/<id>.lean
        required: true
      draft:
        description: Also compile the file without the lint gate (unfinished file, sorry allowed). Never a verdict.
        type: boolean
        default: false
      statement:
        description: Pre-merge check. The ref also adds statements/<id>.lean, copied from an open upstream statement pull request.
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FILE: ${{ inputs.file }}
    steps:
      # Only this ref, without history, and only what the checks read: the diff below asks the GitHub API, and
      # proofs/ (10,000 files, 540 MB) is left out except for the submitted file.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/
            /data/
            /statements/
            /reductions/
            /${{ inputs.file }}
      - name: Only the expected new files against upstream main
        env:
          WITH_STATEMENT: ${{ inputs.statement }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: lefttosolve2/open-math-agents
        run: |
          set -euo pipefail
          printf '%s' "$FILE" | grep -Eq "^proofs/[A-Za-z0-9_.'-]+\.lean$"
          # Same three-dot diff as `git diff FETCH_HEAD...HEAD`, computed by GitHub from the merge base.
          gh api "repos/$UPSTREAM/compare/main...$GITHUB_REPOSITORY_OWNER:$(git rev-parse HEAD)" \
            --jq '.files[] | [(.status | if . == "added" then "A" else . end), .filename] | @tsv' | tee /tmp/diff.txt
          EXPECT="$(printf 'A\t%s' "$FILE")"
          if [ "$WITH_STATEMENT" = "true" ]; then EXPECT="$(printf 'A\t%s\nA\tstatements/%s' "$FILE" "${FILE#proofs/}")"; fi
          [ "$(cat /tmp/diff.txt)" = "$EXPECT" ]
          if gh api "repos/$UPSTREAM/contents/$FILE?ref=main" --silent 2>/dev/null; then echo "already on upstream main: $FILE"; exit 1; fi
      - name: Lint (before anything compiles)
        id: lint
        run: |
          python3 -I tools/lint.py "$FILE" data/catalog.json > /tmp/lint.json && echo "ok=1" >> "$GITHUB_OUTPUT" || true
          cat /tmp/lint.json
      - name: Pinned formal-conjectures
        if: steps.lint.outputs.ok == '1' || inputs.draft
        id: fc
        run: |
          C=$(python3 -I -c 'import json;print(json.load(open("data/catalog.json"))["meta"]["upstreamCommit"])')
          echo "commit=$C" >> "$GITHUB_OUTPUT"
          git init -q "$RUNNER_TEMP/fc" && cd "$RUNNER_TEMP/fc"
          git remote add origin https://github.com/google-deepmind/formal-conjectures
          git fetch -q --depth 1 origin "$C" && git checkout -q FETCH_HEAD
      - uses: actions/cache@v4
        if: steps.lint.outputs.ok == '1' || inputs.draft
        id: cache
        with:
          path: |
            ~/.elan
            ${{ runner.temp }}/fc/.lake
          key: fork-check-fc-${{ steps.fc.outputs.commit }}
      - name: Lean toolchain and Mathlib cache
        if: steps.lint.outputs.ok == '1' || inputs.draft
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          echo "cache-hit=$CACHE_HIT"
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed: $*"; sleep $((i * 20)); done; return 1; }
          if ! command -v lake >/dev/null && [ ! -x ~/.elan/bin/lake ]; then
            retry curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
            retry sh /tmp/elan-init.sh -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # A restored cache was saved after `lake exe cache get`, so it already holds Mathlib's build.
          if [ "$CACHE_HIT" = "true" ] && [ -d "$RUNNER_TEMP/fc/.lake/packages/mathlib/.lake/build/lib" ]; then
            echo "Mathlib build restored from the cache: skipping lake exe cache get"
          else
            cd "$RUNNER_TEMP/fc" && retry ~/.elan/bin/lake exe cache get
          fi
      - name: Compile and audit axioms
        if: steps.lint.outputs.ok == '1'
        run: |
          T0=$(date +%s)
          # tools/check.sh copies every statement and reduction with three processes per file (13,000 files).
          # Here one python process writes the same files, and check.sh runs from a copy of the tree that has no
          # statements/ or reductions/ directory, so it skips its own copy loops and does everything else unchanged.
          SH="$RUNNER_TEMP/root"; mkdir -p "$SH/proofs"
          cp -r tools data "$SH/"; cp "$FILE" "$SH/$FILE"
          python3 -I - "$PWD" "$RUNNER_TEMP/fc" <<'PY'
          import os, re, shutil, sys
          root, fc = sys.argv[1], sys.argv[2]
          for d, lib, pre in (("reductions", "OMAReductions", "R_"), ("statements", "OMAStatements", "S_")):
              src = os.path.join(root, d)
              if not os.path.isdir(src):
                  continue
              dst = os.path.join(fc, lib)
              os.makedirs(dst, exist_ok=True)
              for n in sorted(os.listdir(src)):
                  if n.endswith(".lean"):
                      shutil.copyfile(os.path.join(src, n), os.path.join(dst, pre + re.sub(r"[^A-Za-z0-9]", "_", n[:-5]) + ".lean"))
              lf = os.path.join(fc, "lakefile.toml")
              if ('name = "%s"' % lib) not in open(lf).read():
                  open(lf, "a").write('\n[[lean_lib]]\nname = "%s"\nglobs = ["%s.+"]\n' % (lib, lib))
          PY
          echo "prepared in $(( $(date +%s) - T0 )) s"
          OMA_FC="$RUNNER_TEMP/fc" "$SH/tools/check.sh" "$FILE" verdict.json || true
          echo "checked in $(( $(date +%s) - T0 )) s"
      - name: Draft compile (no lint gate, never a verdict)
        if: inputs.draft && steps.lint.outputs.ok != '1'
        run: |
          MODULE="$(sed -n 's/^import //p' "$FILE" | head -1)"
          printf '%s' "$MODULE" | grep -Eq '^[A-Za-z0-9_.«»]+$'
          cp "$FILE" "$RUNNER_TEMP/fc/OMADraft.lean"
          cd "$RUNNER_TEMP/fc"
          timeout 2400 lake build "$MODULE" 2>&1 | tail -20
          timeout 1800 lake env lean OMADraft.lean 2>&1 | tee /tmp/draft.log | head -c 60000 || true
          echo "---- draft summary ----"
          echo "errors: $(grep -cE ':[0-9]+:[0-9]+: error' /tmp/draft.log)  sorries: $(grep -c 'declaration uses .sorry.' /tmp/draft.log)"
      - name: Verdict
        if: ${{ !cancelled() }}
        run: |
          [ -f verdict.json ] || echo '{"verdict":"none","reason":"checker produced no verdict (lint failed, draft run, or setup fault)"}' > verdict.json
          python3 -I -c 'import json;d=json.load(open("verdict.json"));log=d.pop("log","");print(json.dumps(d,indent=1,ensure_ascii=False));print("---- log ----");print(log)'
